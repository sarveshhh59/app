<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192330"/>
      <stop offset="100%" stop-color="#0e131a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="100%" stop-color="#ffd814"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ff9900" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Main Stationery Icon Container -->
  <g filter="url(#glow)" transform="translate(40, 36)">
    <!-- Open Book / Pages Base -->
    <path d="M 66 310 C 130 290 190 295 216 315 L 216 135 C 190 115 130 110 66 130 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 366 310 C 302 290 242 295 216 315 L 216 135 C 242 115 302 110 366 130 Z" fill="#f0f4f8" opacity="0.9"/>
    
    <!-- Spine Line -->
    <line x1="216" y1="135" x2="216" y2="315" stroke="#ff9900" stroke-width="5" stroke-linecap="round"/>

    <!-- Lined Pages Detail -->
    <line x1="90" y1="165" x2="190" y2="152" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="195" x2="190" y2="182" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="225" x2="190" y2="212" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="255" x2="190" y2="242" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <line x1="242" y1="152" x2="342" y2="165" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="242" y1="182" x2="342" y2="195" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="242" y1="212" x2="342" y2="225" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="242" y1="242" x2="342" y2="255" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <!-- Fountain Pen Nib in Golden Gradient -->
    <g transform="translate(216, 220) rotate(-45)">
      <!-- Pen Body -->
      <path d="M -16 -120 L 16 -120 L 14 -30 L -14 -30 Z" fill="url(#goldGrad)"/>
      <line x1="-16" y1="-80" x2="16" y2="-80" stroke="#ffd814" stroke-width="4"/>
      <!-- Nib Section -->
      <path d="M -14 -30 L 14 -30 L 12 10 L 0 50 L -12 10 Z" fill="url(#yellowGrad)"/>
      <!-- Nib Slit & Breather Hole -->
      <circle cx="0" cy="8" r="3.5" fill="#131921"/>
      <line x1="0" y1="8" x2="0" y2="50" stroke="#131921" stroke-width="2.5"/>
    </g>

    <!-- Amazon-style Golden Smile / Arc below -->
    <path d="M 80 345 Q 216 395 352 345" fill="none" stroke="#ff9900" stroke-width="8" stroke-linecap="round"/>
    <path d="M 338 335 L 358 348 L 345 362 Z" fill="#ff9900"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="3">
    KRISHNAI
  </text>
  <text x="256" y="482" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ff9900" letter-spacing="4">
    STATIONERY
  </text>
</svg>
